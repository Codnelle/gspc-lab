[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reportkit"
version = "1.1.0"
description = "A tiny practice project for the GSoC prep lab: money reports and CSV export."
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
reportkit = "reportkit.cli:main"

[tool.setuptools]
packages = ["reportkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
